<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Website Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello GTA VI!</h1>
        <p>Ini adalah test website pertama saya menggunakan HTML di Notepad.</p>
        <button onclick="tukarTeks()">Klik Sini</button>
        <p id="mesej" style="color: #4caf50; font-weight: bold; margin-top: 15px;"></p>
    </div>

    <script>
        function tukarTeks() {
            document.getElementById("mesej").innerText = "Berjaya! Butang berfungsi dengan baik.";
        }
    </script>

</body>
</html>
